# Loki em modo monolitico (1 pod), armazenamento em disco efemero.
# Chart: grafana-community (o chart OSS migrou do repo grafana/loki em mar/2026).
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    # Necessario para ingestao nativa OTLP (atributos de recurso viram metadata)
    allow_structured_metadata: true

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }

# Componentes desnecessarios para o escopo do desafio (economizam CPU/memoria)
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
