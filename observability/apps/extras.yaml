apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lmartinssilva/togglemaster-gitops.git
    targetRevision: main
    path: observability/extras
    directory:
      include: '*.yaml'
      exclude: healer.py
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 3m
