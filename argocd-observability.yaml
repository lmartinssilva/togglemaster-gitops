# "App of Apps": uma Application que gerencia todas as outras da stack de
# observabilidade (cada arquivo de observability/apps/ vira uma Application filha).
# Aplicar UMA vez:  kubectl apply -f argocd-observability.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lmartinssilva/togglemaster-gitops.git
    targetRevision: main
    path: observability/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
